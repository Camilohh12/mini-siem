# Mini-SIEM: auditoría y detección de anomalías basada en eventos.
#
#   auth-service ──┐
#                  ├─► Kafka ─► security-agent ─► audit-db (solo INSERT)
#   mysql ─► db-log-shipper ┘         └─► Telegram
#
# Uso:  cp .env.example .env  →  editar .env  →  docker compose up -d --build

name: mini-siem

services:
  # ── Base de datos principal: bddatos.tbusuarios ───────────────────────────
  mysql:
    image: mysql:8.4
    container_name: siem-mysql
    restart: unless-stopped
    # El "general log" registra cada conexión y cada sentencia en la tabla
    # mysql.general_log; es la fuente de auditoría del motor.
    command: ["--general-log=ON", "--log-output=TABLE"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: bddatos
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?define APP_DB_PASSWORD en .env}
      AUDIT_READER_PASSWORD: ${AUDIT_READER_PASSWORD:?define AUDIT_READER_PASSWORD en .env}
    ports:
      - "127.0.0.1:3306:3306"   # solo accesible desde tu máquina
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP a propósito: durante la inicialización MySQL solo escucha por
      # socket, así el contenedor no se marca "healthy" antes de tiempo.
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uhealthcheck", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      app_net:
        ipv4_address: 172.28.0.10

  # ── Canal centralizado de eventos ─────────────────────────────────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: siem-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"   # para herramientas en tu máquina (opcional)
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      app_net:
        ipv4_address: 172.28.0.11

  # ── Productor 1: microservicio de Auth (login) ────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: siem-auth
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: bddatos
      DB_USER: ${APP_DB_USER:-app_user}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_AUTH: auth.events
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks:
      app_net:
        ipv4_address: 172.28.0.20

  # ── Productor 2: envía el log de auditoría de MySQL a Kafka ───────────────
  db-log-shipper:
    build: ./db-log-shipper
    container_name: siem-db-shipper
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: audit_reader
      DB_PASSWORD: ${AUDIT_READER_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_DB: db.audit
    volumes:
      - shipper_state:/state
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks:
      app_net:
        ipv4_address: 172.28.0.21

  # ── Consumidor: agente de seguridad ───────────────────────────────────────
  security-agent:
    build: ./security-agent
    container_name: siem-agent
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPICS: auth.events,db.audit
      AUDIT_DB_HOST: audit-db
      AUDIT_DB_NAME: bdauditoria
      AUDIT_DB_USER: audit_writer
      AUDIT_DB_PASSWORD: ${AUDIT_WRITER_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Mexico_City}
      # Usuarios de aplicación que nunca deberían ejecutar DDL/DCL
      APP_DB_USERS: ${APP_DB_USER:-app_user}
      # IPs desde las que es normal conectarse a MySQL (auth-service y shipper)
      IPS_BD_PERMITIDAS: 172.28.0.20,172.28.0.21
      TABLAS_SENSIBLES: tbusuarios
      GEOIP_HABILITADO: ${GEOIP_HABILITADO:-true}
    depends_on:
      kafka: { condition: service_healthy }
      audit-db: { condition: service_healthy }
    networks:
      app_net:
        ipv4_address: 172.28.0.22
      audit_net: {}

  # ── Almacenamiento inmutable (aislado: sin puertos y en su propia red) ────
  audit-db:
    image: mysql:8.4
    container_name: siem-audit-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AUDIT_ROOT_PASSWORD:?define AUDIT_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: bdauditoria
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD:?define AUDIT_WRITER_PASSWORD en .env}
    volumes:
      - audit_data:/var/lib/mysql
      - ./audit-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP a propósito: durante la inicialización MySQL solo escucha por
      # socket, así el contenedor no se marca "healthy" antes de tiempo.
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uhealthcheck", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - audit_net

networks:
  # Red de la aplicación con subred fija: así el agente sabe qué IPs son
  # "microservicios conocidos". Las IP dinámicas salen de la mitad alta.
  app_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25
  # Red interna: solo el agente alcanza la base de auditoría.
  audit_net:
    internal: true

volumes:
  mysql_data:
  kafka_data:
  shipper_state:
  audit_data:
