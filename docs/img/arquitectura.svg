<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Arquitectura del Mini-SIEM: productores, Kafka, agente de seguridad, Telegram y base de auditoría inmutable">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Etiquetas de capa -->
  <g font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.2">
    <text x="40" y="38">PRODUCTORES</text>
    <text x="480" y="200" text-anchor="middle">CANAL DE EVENTOS</text>
    <text x="40" y="358">CONSUMIDOR Y DESTINOS</text>
  </g>

  <!-- Conectores -->
  <g fill="none" stroke="#64748B" stroke-width="1.5">
    <path d="M610 96H656" marker-end="url(#flecha)"/>
    <path d="M170 136V212" marker-end="url(#flecha)"/>
    <path d="M790 136V212" marker-end="url(#flecha)"/>
  </g>
  <g fill="none" stroke="#2563EB" stroke-width="1.75">
    <path d="M480 296V372" marker-end="url(#flecha-azul)"/>
    <path d="M350 416H304" marker-end="url(#flecha-azul)"/>
    <path d="M610 416H656" marker-end="url(#flecha-azul)"/>
  </g>

  <!-- Productores -->
  <g>
    <rect x="40" y="56" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">auth-service</text>
    <text x="170" y="106" text-anchor="middle" font-size="12.5" fill="#475569">Login · FastAPI · JWT · bcrypt</text>
    <text x="170" y="124" text-anchor="middle" font-size="12.5" fill="#475569">emite cada intento de acceso</text>
  </g>
  <g>
    <rect x="350" y="56" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="480" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">MySQL 8.4 · bddatos</text>
    <text x="480" y="106" text-anchor="middle" font-size="12.5" fill="#475569">tabla tbusuarios</text>
    <text x="480" y="124" text-anchor="middle" font-size="12.5" fill="#475569">general_log activado</text>
  </g>
  <g>
    <rect x="660" y="56" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="790" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">db-log-shipper</text>
    <text x="790" y="106" text-anchor="middle" font-size="12.5" fill="#475569">lee mysql.general_log</text>
    <text x="790" y="124" text-anchor="middle" font-size="12.5" fill="#475569">detecta log vaciado o apagado</text>
  </g>

  <!-- Kafka -->
  <g>
    <rect x="40" y="216" width="880" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="480" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Apache Kafka 4.2 (KRaft)</text>
    <text x="480" y="272" text-anchor="middle" font-size="12.5" fill="#475569">entrega asíncrona, al menos una vez</text>
    <rect x="110" y="240" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="170" y="260" text-anchor="middle" font-size="13" font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#0F172A">auth.events</text>
    <rect x="740" y="240" width="100" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="790" y="260" text-anchor="middle" font-size="13" font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#0F172A">db.audit</text>
  </g>
  <text x="492" y="340" font-size="12" fill="#2563EB">consume en tiempo real</text>

  <!-- Agente -->
  <g>
    <rect x="350" y="376" width="260" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="480" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">security-agent</text>
    <text x="480" y="426" text-anchor="middle" font-size="12.5" fill="#1E3A8A">Python · confluent-kafka</text>
    <text x="480" y="444" text-anchor="middle" font-size="12.5" fill="#1E3A8A">10 reglas de detección</text>
  </g>

  <!-- Destinos -->
  <g>
    <rect x="40" y="376" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Telegram</text>
    <text x="170" y="426" text-anchor="middle" font-size="12.5" fill="#475569">Bot API · sendMessage</text>
    <text x="170" y="444" text-anchor="middle" font-size="12.5" fill="#475569">alerta en segundos</text>
  </g>
  <g>
    <rect x="644" y="360" width="292" height="152" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.25" stroke-dasharray="6 5"/>
    <text x="656" y="500" font-size="11.5" fill="#64748B">red interna aislada · sin puertos expuestos</text>
    <rect x="660" y="376" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="790" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">audit-db · bdauditoria</text>
    <text x="790" y="426" text-anchor="middle" font-size="12.5" fill="#475569">almacenamiento inmutable</text>
    <text x="790" y="444" text-anchor="middle" font-size="12.5" fill="#475569">solo INSERT · triggers anti-borrado</text>
  </g>
</svg>
